# Use Case: multiple Proxmox Backup Servers, one exporter instance per PBS
#           (e.g. an exporter installed on each PBS)
#           each exporter's config file has one module "default" for its PBS
#
# Setup:
# - first exporter instance: pbs-exporter-1
# - second exporter instance: pbs-exporter-2
#
# To scrape several PBS with one exporter instance instead, see
# multiple-modules.yaml.

scrape_configs:
- job_name: 'pbs-exporter'
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - 'pbs-exporter-1:10019' # module "default": PBS 1
    - 'pbs-exporter-2:10019' # module "default": PBS 2

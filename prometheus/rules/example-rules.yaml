# Example alerts for pbs-exporter. Thresholds are examples: adjust them to
# your backup schedules (e.g. weekly backups need more than 2 days).
groups:
  - name: ProxmoxBackupServer.rules

    rules:
      # --- exporter and server ---------------------------------------------

      - alert: ProxmoxBackupHostDown
        expr: "pbs_up == 0"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Proxmox Backup Server down
          description: "The version call to Proxmox Backup Server {{ $labels.instance }} fails: it does not answer, rejects the API token or answers without data. See the exporter log."

      - alert: ProxmoxBackupCollectorFailed
        expr: "pbs_collector_success == 0"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: pbs-exporter collector {{ $labels.collector }} fails
          description: "The {{ $labels.collector }} collector for {{ $labels.instance }} fails, its metrics are missing or incomplete (e.g. a missing privilege of the API token). See the exporter log."

      # --- backups ---------------------------------------------------------

      - alert: ProxmoxBackupSnapshotOutdated
        expr: |
          ((time() - pbs_group_last_backup_timestamp_seconds) / 86400 > 2)
            * on (instance, datastore, datastore_namespace, backup_type, backup_id) group_left (comment) pbs_group_info
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Last backup of {{ $labels.backup_type }}/{{ $labels.backup_id }} is older than 2 days
          description: "The newest finished backup of {{ $labels.backup_type }}/{{ $labels.backup_id }} ({{ $labels.comment }}) in {{ $labels.datastore }}/{{ $labels.datastore_namespace }} is {{ $value | printf \"%.1f\" }} days old."

      - alert: ProxmoxBackupSnapshotVerifyFailed
        expr: "pbs_group_snapshots_by_verify_state{state=\"failed\"} > 0"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Verification of backups of {{ $labels.backup_type }}/{{ $labels.backup_id }} failed
          description: "{{ $value }} snapshots of {{ $labels.backup_type }}/{{ $labels.backup_id }} in {{ $labels.datastore }}/{{ $labels.datastore_namespace }} on {{ $labels.instance }} failed verification: they may not be restorable."

      # a verify job that runs and succeeds verifies every snapshot it covers;
      # failed and overdue verify jobs are reported by the job alerts
      - alert: ProxmoxBackupDatastoreNotVerified
        expr: |
          pbs_datastore_info{verify_new!="true"}
            unless on (instance, datastore) pbs_verify_job_info
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Datastore {{ $labels.datastore }} is never verified
          description: "{{ $labels.datastore }} on {{ $labels.instance }} has no verify job and does not verify new snapshots: damaged backups go unnoticed until a restore."

      - alert: ProxmoxBackupBadChunks
        expr: "pbs_gc_bad_chunks{state=\"still_bad\"} > 0"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Corrupt chunks in datastore {{ $labels.datastore }}
          description: "The last garbage collection of {{ $labels.datastore }} on {{ $labels.instance }} found {{ $value }} corrupt chunks that snapshots still reference."

      # --- jobs ------------------------------------------------------------

      - alert: ProxmoxBackupJobFailed
        expr: "pbs_job_last_run_success == 0"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job_type }} job {{ $labels.job_id }} failed"
          description: "The last run of the {{ $labels.job_type }} job {{ $labels.job_id }} ({{ $labels.datastore }}/{{ $labels.datastore_namespace }}) on {{ $labels.instance }} failed."

      # PBS's next run stays in the past when a scheduled run did not start;
      # disabled prune jobs keep a next run (job IDs are unique per type only)
      - alert: ProxmoxBackupJobOverdue
        expr: |
          time() - pbs_job_next_run_timestamp_seconds{job_type!="prune"} > 900
            or (
              time() - pbs_job_next_run_timestamp_seconds{job_type="prune"} > 900
                unless on (instance, job_id) pbs_prune_job_info{disable="true"}
            )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job_type }} job {{ $labels.job_id }} is overdue"
          description: "The {{ $labels.job_type }} job {{ $labels.job_id }} on {{ $labels.instance }} should have started {{ $value | humanizeDuration }} ago."

      # --- datastores ------------------------------------------------------

      - alert: ProxmoxBackupDatastoreInaccessible
        # offline maintenance also makes a datastore inaccessible
        expr: |
          pbs_datastore_error == 1
            unless on (instance, datastore) pbs_datastore_maintenance
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Datastore {{ $labels.datastore }} is not accessible
          description: "PBS {{ $labels.instance }} can not open the datastore {{ $labels.datastore }} (e.g. its storage failed). See the exporter log for the error."

      - alert: ProxmoxBackupPoolDiskOutOfSpace
        expr: "pbs_datastore_used_bytes / pbs_datastore_size_bytes * 100 > 90"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Proxmox datastore out of space (datastore {{ $labels.datastore }})
          description: "Datastore {{ $labels.datastore }} on {{ $labels.instance }} is almost full (< 10% left)\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupPoolDiskFillingUpInFourDays
        # PBS reports a date in the past when it has no estimate
        expr: "pbs_datastore_estimated_full_timestamp_seconds - time() > 0 < 4 * 86400"
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Proxmox datastore is filling up.
          description: "Proxmox Backup Server expects the datastore {{ $labels.datastore }} on {{ $labels.instance }} to be full in {{ $value | humanizeDuration }}."

      # --- node ------------------------------------------------------------

      - alert: ProxmoxBackupZfsPoolUnhealthy
        expr: 'pbs_zfs_pool_health_info{health!="ONLINE"}'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: ZFS pool {{ $labels.pool }} is {{ $labels.health }}
          description: "The ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is {{ $labels.health }}."

      - alert: ProxmoxBackupZfsPoolMissing
        # PBS does not list pools it can not read the usage of (e.g. FAULTED);
        # a lost last pool counts as 0, unless the zfs collector fails
        expr: |
          (
            count by (instance) (pbs_zfs_pool_health_info)
              or on (instance) 0 * count by (instance) (pbs_zfs_pool_health_info offset 1h)
          ) < count by (instance) (pbs_zfs_pool_health_info offset 1h)
            and on (instance) pbs_collector_success{collector="zfs"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: ZFS pool missing on {{ $labels.instance }}
          description: "{{ $labels.instance }} lists fewer ZFS pools than an hour ago: a pool may have failed (FAULTED or UNAVAIL pools are not listed)."

      - alert: ProxmoxBackupClockSkew
        expr: "abs(pbs_node_time_seconds - timestamp(pbs_node_time_seconds)) > 30"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Clock of {{ $labels.instance }} is off
          description: "The clock of {{ $labels.instance }} differs by {{ $value | printf \"%.0f\" }} seconds from the scrape time."

      - alert: ProxmoxBackupRootDiskOutOfSpace
        expr: "pbs_node_rootfs_used_bytes / pbs_node_rootfs_size_bytes * 100 > 90"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Proxmox root disk out of space (instance {{ $labels.instance }})
          description: "Disk is almost full (< 10% left)\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupRootDiskFillingUpInFourDays
        expr: |
          pbs_node_rootfs_used_bytes / pbs_node_rootfs_size_bytes > 0.7 and pbs_node_rootfs_used_bytes > 0 and
          predict_linear(pbs_node_rootfs_available_bytes[6h], 4 * 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Proxmox root disk is filling up.
          description: "Based on recent sampling, the root disk of {{ $labels.instance }} is expected to fill up within four days. Currently {{ $value | humanizePercentage }} is used."

      - alert: ProxmoxBackupHostOutOfMemory
        expr: "pbs_node_memory_used_bytes / pbs_node_memory_size_bytes * 100 > 90"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Proxmox host out of memory (instance {{ $labels.instance }})
          description: "Node memory is filling up (< 10% left)\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupHostSwapIsFillingUp
        expr: "pbs_node_swap_used_bytes / pbs_node_swap_size_bytes * 100 > 80"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Proxmox host swap is filling up (instance {{ $labels.instance }})
          description: "Swap is filling up (> 80%)\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupHostHighCpuLoad
        expr: "avg_over_time(pbs_node_cpu_usage_ratio[10m]) > 0.8"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host high CPU load (instance {{ $labels.instance }})
          description: "CPU load is > 80%\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupHostHighIowait
        expr: "avg_over_time(pbs_node_io_wait_ratio[10m]) * 100 > 10"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU high iowait (instance {{ $labels.instance }})
          description: "CPU iowait > 10%. A high iowait means that you are disk or network bound.\n  VALUE = {{ $value }}"

      - alert: ProxmoxBackupSubscriptionDueSoon
        expr: "(pbs_node_subscription_due_timestamp_seconds - time() < 14 * 86400) * on (instance) group_left (productname) pbs_node_subscription_info"
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Subscription of {{ $labels.instance }} is due soon
          description: "The subscription {{ $labels.productname }} of {{ $labels.instance }} is due in {{ $value | humanizeDuration }}."

# The configuration is read from pbs-exporter.yml next to this file (see
# pbs-exporter.example.yml). The container runs as user 65534, which must be
# able to read it, e.g.: chown 65534 pbs-exporter.yml && chmod 400 pbs-exporter.yml
services:
  pbs-exporter:
    image: ghcr.io/natrontech/pbs-exporter:latest
    container_name: pbs-exporter
    user: '65534'
    restart: always
    ports:
      - "10019:10019"
    volumes:
      - ./pbs-exporter.yml:/etc/pbs-exporter/config.yml:ro

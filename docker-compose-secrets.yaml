# The API token secrets are kept out of the config file: each module of
# pbs-exporter.yml (see pbs-exporter.example.yml) reads its token from a
# secret, e.g.
#
#   defaults:
#     user: monitoring@pbs
#     token_name: exporter
#   modules:
#     default:
#       endpoint: https://pbs-a:8007
#       token_value_file: /run/secrets/pbs-default-token
#     site-b:
#       endpoint: https://pbs-b:8007
#       token_value_file: /run/secrets/pbs-site-b-token
#
# The container runs as user 65534, which must be able to read the config file
# and the secret files.
services:
  pbs-exporter:
    image: ghcr.io/natrontech/pbs-exporter:latest
    container_name: pbs-exporter
    user: '65534'
    restart: always
    ports:
      - "10019:10019"
    volumes:
      - ./pbs-exporter.yml:/etc/pbs-exporter/config.yml:ro
    secrets:
      - pbs-default-token
      - pbs-site-b-token

secrets:
  # example with secret files in the .secrets folder
  pbs-default-token:
    file: "./.secrets/pbs_default_token.secret"
  pbs-site-b-token:
    file: "./.secrets/pbs_site_b_token.secret"

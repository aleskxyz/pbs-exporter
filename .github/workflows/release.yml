name: goreleaser

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  goreleaser:
    outputs:
      hashes: ${{ steps.binary.outputs.hashes }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # sign archives with cosign
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Update goreportcard
        # best effort: an unavailable goreportcard.com must not block the release
        continue-on-error: true
        uses: creekorful/goreportcard-action@1f35ced8cdac2cba28c9a2f2288a16aacfd507f9 # v1.0
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate binary hashes
        id: binary
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(cat $checksum_file | base64 -w0)" >> "$GITHUB_OUTPUT"

  ko-publish:
    outputs:
      digest: ${{ steps.release.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # sign archives with cosign
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set image name
        id: image
        run: |
          set -euo pipefail
          # publish to the owner of the repository running the workflow (works in forks),
          # ghcr.io requires lowercase names
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${owner}/pbs-exporter" >> "$GITHUB_OUTPUT"
      - name: Publish pbs-exporter
        id: release
        uses: ./.github/actions/publish-image
        with:
          makefile-target: ko-publish
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ steps.image.outputs.owner }}
          version: ${{ github.ref_name }}
          sign-image: true
          sbom-name: pbs-exporter
          main-path: ./

  binary-provenance:
    needs: [goreleaser]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance (fetch an OIDC token from GitHub)
      contents: write # To add assets to a release.
    # MUST be referenced by tag (see https://github.com/slsa-framework/slsa-github-generator/?tab=readme-ov-file#referencing-slsa-builders-and-generators)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true # upload to a new release
      draft-release: true

  image-provenance:
    needs: [ko-publish]
    permissions:
      actions: read
      id-token: write
      packages: write
    # MUST be referenced by tag (see https://github.com/slsa-framework/slsa-github-generator/?tab=readme-ov-file#referencing-slsa-builders-and-generators)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.ko-publish.outputs.image }}
      digest: ${{ needs.ko-publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verification-with-cosign:
    needs: [ko-publish, image-provenance]
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify provenance of image
        env:
          IMAGE: ${{ needs.ko-publish.outputs.image }}
          DIGEST: ${{ needs.ko-publish.outputs.digest }}
        run: |
          set -euo pipefail
          # policy.cue pins the upstream repository, verify against the one running the workflow (works in forks).
          # The source uri is matched exactly, a regex would treat dots in repository names as wildcards.
          # The tag format check replaces the one of the policy's regex and keeps the sed replacement safe.
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "ERROR: unexpected tag $GITHUB_REF" >&2
            exit 1
          fi
          uri="git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF}"
          sed -E "s|^( *uri: ).*$|\1\"${uri}\"|" policy.cue > "$RUNNER_TEMP/policy.cue"
          grep -qxF "      uri: \"${uri}\"" "$RUNNER_TEMP/policy.cue"
          cosign verify-attestation \
            --type slsaprovenance \
            --new-bundle-format=false \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v[0-9]+.[0-9]+.[0-9]+$' \
            --policy "$RUNNER_TEMP/policy.cue" \
            $IMAGE@$DIGEST

      - name: Verify signature of image
        env:
          IMAGE: ${{ needs.ko-publish.outputs.image }}
          DIGEST: ${{ needs.ko-publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --new-bundle-format \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            $IMAGE@$DIGEST

      - name: Verify sbom of image
        env:
          IMAGE: ${{ needs.ko-publish.outputs.image }}
          DIGEST: ${{ needs.ko-publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify-attestation --new-bundle-format \
            --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --policy policy-sbom.cue \
            $IMAGE@$DIGEST
